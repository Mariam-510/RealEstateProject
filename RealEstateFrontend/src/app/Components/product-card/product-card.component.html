<!-- product-card.component.html -->
<div class="product-card p-2">
  <div class="card-image-container position-relative">
    <img
      [src]="
        'https://st3.depositphotos.com/1177973/12669/i/450/depositphotos_126693854-stock-photo-set-of-body-care-products.jpg'
      "
      class="card-img w-100"
      alt="https://i.quotev.com/b2gtjqawaaaa.jpg"
      (error)="productService.setFallbackImageForCard($event)"
    />

    <!-- Action buttons -->
    <div class="action-buttons">
      <button
        class="action-btn cart-btn"
        [ngClass]="{ active: inCart }"
        (click)="toggleCart()"
      >
        <i class="bi" [ngClass]="inCart ? 'bi-cart-fill' : 'bi-cart'"></i>
      </button>
      <button
        class="action-btn wishlist-btn"
        [ngClass]="{ active: inWishlist }"
        (click)="toggleWishlist()"
      >
        <i class="bi" [ngClass]="inWishlist ? 'bi-heart-fill' : 'bi-heart'"></i>
      </button>
    </div>
  </div>

  <div class="card-body py-3 px-1">
    <div
      class="title-price-section d-flex justify-content-between align-items-center"
    >
      <h3 class="card-title fs-4">{{ product.name }}</h3>
      <h3 class="price-section fs-4" style="color: #c38e79">
        ${{ product.price | number }}
      </h3>
    </div>
    <p class="card-text">{{ product.description }}</p>

    <!-- Modified rating section -->
    <div
      class="rating-section d-flex align-items-center gap-1 mt-2"
      title="Average rating: {{ product.averageRating }}"
    >
      <ng-container *ngFor="let star of fullStars">
        <i class="bi bi-star-fill rating-star"></i>
      </ng-container>
      <ng-container *ngIf="hasHalfStar">
        <i class="bi bi-star-half rating-star"></i>
      </ng-container>
      <ng-container *ngFor="let star of emptyStars">
        <i class="bi bi-star rating-star"></i>
      </ng-container>
    </div>
  </div>
</div>
