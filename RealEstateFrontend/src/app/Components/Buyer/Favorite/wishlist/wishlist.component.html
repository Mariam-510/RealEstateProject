<div class="d-flex justify-content-between align-items-center mt-5 ms-5 me-5">
    <!-- Left side: Title and Breadcrumb -->
    <div class="pb-5 px-4">
      <h2 class="fw-bold"><span style="font-size: 0.9em;">❤️</span> Favourites</h2>
      <nav aria-label="breadcrumb mb-0">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item mb-0">
            <p class="text-muted mb-0">User</p>
          </li>
          <li class="breadcrumb-item active fw-semibold text-caffe" aria-current="page">Favourites</li>
        </ol>
      </nav>
    </div>
  
    <!-- Right side: Toggle Button Group -->
    <div class="btn-group rounded-pill border p-1 bg-light" role="group" style="width: 220px;">
      <input type="radio" class="btn-check" name="toggle" id="properties" autocomplete="off" checked
        (change)="toggleCategory('Properties')">
      <label class="btn btn-light rounded-5 flex-grow-1 px-3 no-border fs-6" for="properties">Properties</label>
  
      <input type="radio" class="btn-check" name="toggle" id="products" autocomplete="off"
        (change)="toggleCategory('Products')">
      <label class="btn btn-light rounded-5 flex-grow-1 no-border fs-6" for="products">Products</label>
    </div>
  </div>
  
  <!-- Dynamic Components -->
  <app-favorite-properties *ngIf="selectedCategory === 'Properties'"></app-favorite-properties>
  <app-favorite-products *ngIf="selectedCategory === 'Products'"></app-favorite-products>
