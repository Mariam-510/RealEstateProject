<div class="category-page">
  <div
    class="header-placeholder"
    style="height: 80px; background: #eee; margin-bottom: 20px"
  >
    <!-- Will be replaced by actual header later -->
  </div>

  <div class="category-content mx-5">
    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <div *ngIf="!loading && !error" class="row g-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div
          class="d-flex flex-column justify-content-center align-items-center text-center w-100"
        >
          <h1 class="category-title">{{ products[0].categoryName }}</h1>
          <p class="product-count">({{ products.length }} products)</p>
        </div>

        <!-- Cart Button -->
        <button
          type="button"
          class="btn btn-warning me-3"
          [routerLink]="'/cart'"
          title="Go to Cart"
        >
          <i class="bi bi-cart-fill"></i> Cart
        </button>

        <div class="d-flex">
          <!-- View Toggle -->
          <div class="btn-group me-3">
            <button
              type="button"
              class="btn btn-light"
              [class.active]="viewMode === 'grid'"
              (click)="toggleViewMode('grid')"
              title="Grid view"
            >
              <i class="bi bi-grid-3x3-gap-fill"></i>
            </button>
            <button
              type="button"
              class="btn btn-light"
              [class.active]="viewMode === 'list'"
              (click)="toggleViewMode('list')"
              title="List view"
            >
              <i class="bi bi-list"></i>
            </button>
          </div>

          <!-- Sort Dropdown -->
          <div class="dropdown">
            <button
              class="btn btn-light dropdown-toggle sort-btn"
              type="button"
              id="sortDropdown"
              data-bs-toggle="dropdown"
              aria-expanded="false"
              (click)="toggleSortDropdown()"
              #sortBtn
            >
              Sort <i class="bi bi-chevron-down"></i>
            </button>
            <ul
              class="dropdown-menu sort-dropdown"
              [class.show]="sortDropdownOpen"
              aria-labelledby="sortDropdown"
            >
              <li>
                <div class="form-check dropdown-item">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="sortOption"
                    id="recommended"
                    [checked]="sortOption === 'recommended'"
                    (change)="setSortOption('recommended')"
                  />
                  <label class="form-check-label w-100" for="recommended"
                    >Recommended</label
                  >
                </div>
              </li>
              <li>
                <div class="form-check dropdown-item">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="sortOption"
                    id="newArrival"
                    [checked]="sortOption === 'newArrival'"
                    (change)="setSortOption('newArrival')"
                  />
                  <label class="form-check-label w-100" for="newArrival"
                    >New Arrival</label
                  >
                </div>
              </li>
              <li>
                <div class="form-check dropdown-item">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="sortOption"
                    id="popularity"
                    [checked]="sortOption === 'popularity'"
                    (change)="setSortOption('popularity')"
                  />
                  <label class="form-check-label w-100" for="popularity"
                    >Popularity</label
                  >
                </div>
              </li>
              <li>
                <div class="form-check dropdown-item">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="sortOption"
                    id="priceHighToLow"
                    [checked]="sortOption === 'priceHighToLow'"
                    (change)="setSortOption('priceHighToLow')"
                  />
                  <label class="form-check-label w-100" for="priceHighToLow"
                    >Price : High to Low</label
                  >
                </div>
              </li>
              <li>
                <div class="form-check dropdown-item">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="sortOption"
                    id="priceLowToHigh"
                    [checked]="sortOption === 'priceLowToHigh'"
                    (change)="setSortOption('priceLowToHigh')"
                  />
                  <label class="form-check-label w-100" for="priceLowToHigh"
                    >Price : Low to High</label
                  >
                </div>
              </li>
              <li>
                <div class="form-check dropdown-item">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="sortOption"
                    id="alphabetical"
                    [checked]="sortOption === 'alphabetical'"
                    (change)="setSortOption('alphabetical')"
                  />
                  <label class="form-check-label w-100" for="alphabetical"
                    >Alphabetical : A to Z</label
                  >
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Yellow Horizontal Line -->
      <hr style="color: #c38e79; margin: 0%" />

      <!-- Grid View -->
      <div *ngIf="viewMode === 'grid'" class="row g-4">
        <div
          class="col-12 col-md-6 col-lg-4 col-xl-4"
          *ngFor="let product of paginatedProducts">
          <!-- <app-product-card [product]="product"></app-product-card> -->
           <app-tttt [product]="product"></app-tttt>
        </div>
      </div>

      <!-- List View -->
      <div *ngIf="viewMode === 'list'" class="row g-4">
        <div class="col-12" *ngFor="let product of paginatedProducts">
          <app-product-list-item [product]="product"></app-product-list-item>
        </div>
      </div>

      <!-- pagination -->
      <div
        class="pagination-container d-flex justify-content-center my-5"
        *ngIf="totalPages > 1"
      >
        <nav>
          <ul class="pagination">
            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link" (click)="goToPage(currentPage - 1)">
                <i class="bi bi-chevron-left"></i>
              </a>
            </li>

            <li
              class="page-item"
              *ngFor="let page of visiblePages"
              [class.active]="page === currentPage"
              [class.disabled]="page === '...'"
            >
              <a
                class="page-link"
                (click)="goToPage(page)"
                *ngIf="page !== '...'; else ellipsis"
              >
                {{ page }}
              </a>
              <ng-template #ellipsis>
                <span class="page-link disabled">...</span>
              </ng-template>
            </li>

            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <a class="page-link" (click)="goToPage(currentPage + 1)">
                <i class="bi bi-chevron-right"></i>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>

  <div
    class="footer-placeholder"
    style="height: 60px; background: #eee; margin-top: 20px"
  >
    <!-- Will be replaced by actual footer later -->
  </div>
</div>
