<!-- components/chat/chat.component.html -->
<div class="chat-container">
  <div class="chat-sidebar">
    <h5>Chat</h5>
    
    <!-- User input to start chat -->
    <div class="user-input">
      <p *ngIf="isBuyer">Enter Seller ID to chat:</p>
      <p *ngIf="!isBuyer">Enter Buyer ID to chat:</p>
      <input type="text" [(ngModel)]="targetUserId" placeholder="Enter user ID">
      <button (click)="startChat()">Start Chat</button>
    </div>
  </div>

  <div class="chat-main" *ngIf="selectedUserId">
    <div class="chat-header">
      <h5>Chatting with {{ selectedUserId }}</h5>
    </div>
    <div class="chat-messages">
      <div *ngFor="let message of messages" 
           class="message" 
           [class.sent]="isCurrentUser(message.senderId)"
           [class.received]="!isCurrentUser(message.senderId)">
        <div class="message-content">{{ message.content }}</div>
        <div class="message-time">{{ message.sentAt | date:'shortTime' }}</div>
      </div>
    </div>

    <div class="chat-input">
      <input type="text" [(ngModel)]="newMessage" placeholder="Type a message..." (keyup.enter)="sendMessage()">
      <button (click)="sendMessage()">Send</button>
    </div>
  </div>

  <div class="chat-placeholder" *ngIf="!selectedUserId">
    <p>Enter a user ID and click "Start Chat" to begin</p>
  </div>
</div>
