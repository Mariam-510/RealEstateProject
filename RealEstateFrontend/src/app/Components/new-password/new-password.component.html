<div class="d-flex w-100 min-vh-100 shadow overflow-hidden">
    <div class="left-section d-flex align-items-center justify-content-center w-50">
      <div class="text-brown p-5 rounded-5 border border-light shadow-lg w-100">
        <div class="text-center text-brown ps-4 pe-4">
          <i class="bi bi-lock-fill" style="font-size: 50px;"></i>
        </div>
        <h1 class="text-brown mb-2 text-center">Change Password</h1>
        <form [formGroup]="changpassword" (ngSubmit)="Change()">
          <div class="mb-3 mt-5">
            <label class="form-label fw-semibold mb-2">New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0">
                <i class="bi bi-key text-brown fs-5"></i>
            </span>
              <input
                type="password"
                class="form-control border-0 shadow-sm"
                placeholder="Enter Pasword"
                formControlName="pass"
              />
            </div>
            <div *ngIf="changpassword.get('pass')?.hasError('required') && changpassword.get('pass')?.touched"
                    class="text-danger small ps-2">
                    Password is required.
                </div>
                <div *ngIf="changpassword.get('pass')?.hasError('minlength') && changpassword.get('pass')?.touched"
                    class="text-danger small ps-2">
                    Password must be at least 8 characters.
                </div>
                <div *ngIf="changpassword.get('pass')?.hasError('maxlength') && changpassword.get('pass')?.touched"
                    class="text-danger small ps-2">
                    Password cannot exceed 10 characters.
                </div>
                <div *ngIf="changpassword.get('pass')?.hasError('pattern') && changpassword.get('pass')?.touched"
                    class="text-danger small ps-2">
                    Password must contain at least one uppercase letter, one lowercase letter, one number, and one
                    special character.
                </div>

          </div>
          <div class="mb-2 mt-2">
                <label class="form-label fw-semibold mb-0">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0">
                        <i class="bi bi-key-fill text-brown fs-5"></i>
                    </span>
                    <input type="password" class="form-control border-0 shadow-sm" placeholder="Enter Confirm Password"
                        formControlName="confirmPassword">
                </div>
                <div *ngIf="changpassword.get('confirmPassword')?.hasError('required') && changpassword.get('confirmPassword')?.touched"
                    class="text-danger small ps-2">
                    Confirm Password is required.
                </div>
                <div *ngIf="changpassword.get('pass')?.touched && changpassword.get('confirmPassword')?.touched && changpassword.get('pass')?.value !== changpassword.get('confirmPassword')?.value"
                    class="text-danger small ps-2">
                    Confirm Passwords do not match.
                </div>
            </div>
  
          <div class="error text-danger ms-3">

          </div>

          <button type="submit" class="mt-5 mb-4 text-light p-2 btnStyle bg-brown w-50 mx-auto d-block text-center">
            Save
          </button>
        </form>
      </div>
    </div>
    <div class="right-section d-none d-md-block w-50">
      <!-- Right section content goes here -->
    </div>
  </div>
