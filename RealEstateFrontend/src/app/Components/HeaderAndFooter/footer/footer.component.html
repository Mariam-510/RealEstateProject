<div class="footer-container">
  <!-- Main Footer Content -->
  <div class="footer-content">
    <!-- Brand and Social -->
    <div class="footer-section">
      <h4 class="footer-heading">
        <a routerLink="/" class="footer-brand-link">UrbanNest</a>
      </h4>
      <p class="footer-description">
        Transforming spaces into dream homes through curated properties,
        premium furniture, and exciting auctions.
      </p>
      <div class="social-links">
        <a href="#"><i class="bi bi-facebook"></i></a>
        <a href="#"><i class="bi bi-twitter"></i></a>
        <a href="#"><i class="bi bi-instagram"></i></a>
        <a href="#"><i class="bi bi-linkedin"></i></a>
      </div>
    </div>

    <!-- Quick Links -->
    <div class="footer-section">
      <h4 class="footer-heading">Quick Links</h4>
      <nav class="d-flex justify-content-center d-md-block">
        <ul>
          <li *ngFor="let link of quickLinks">
            <a [routerLink]="link.path" class="footer-link fs-6"><i class="bi {{ link.icon }} me-2"></i>{{ link.label
              }}</a>
          </li>
        </ul>
      </nav>
    </div>

    <!-- Legal -->
    <div class="footer-section">
      <h4 class="footer-heading">Legal</h4>
      <nav class="d-flex justify-content-center d-md-block">
        <ul>
          <li *ngFor="let link of legalLinks">
            <a [routerLink]="link.path" class="footer-link fs-6"><i class="bi {{ link.icon }} me-2"></i>{{ link.label
              }}</a>
          </li>
        </ul>
      </nav>
    </div>

    <!-- Contact Info -->
    <div class="footer-section">
      <h4 class="footer-heading">Contact Us</h4>
      <div class="contact-info">
        <p class="fs-6"><i class="bi bi-envelope-fill"></i> support&#64;urbannest.com</p>
        <p class="fs-6"><i class="bi bi-telephone-fill"></i> +20 123 456 7890</p>
      </div>
    </div>
  </div>

  <!-- Copyright Notice -->
  <div class="copyright">
    <p class="mb-0">
      © {{ currentYear }} UrbanNest. All rights reserved.
    </p>
  </div>
</div>
