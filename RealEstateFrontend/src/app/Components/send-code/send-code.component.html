<div class="d-flex w-100 min-vh-100 shadow overflow-hidden">
    <div class="left-section d-flex align-items-center justify-content-center w-50">
        <div class="text-brown p-5 rounded-5 border border-light shadow-lg w-100">
            <div class="text-center text-brown ps-4 pe-4"><i class="bi bi-envelope-check" style="font-size: 50px;"></i>
            </div>
            <h1 class="text-brown mb-2 text-center">
                Check Your Email
            </h1>
            <p class="text-muted text-center">We sent a code to your email. Enter that code to confirm your account.
            </p>
            <p class="text-center text-muted">{{ displayTime }}</p>
            <form (ngSubmit)="Confirm()">

                <div class="mt-4">
                    <div class="d-flex justify-content-center gap-2">
                        <div *ngFor="let ctrl of codeArray; let i = index; trackBy: trackByIndex" class="text-center">
                          <input 
                            type="text" 
                            maxlength="1" 
                            class="form-control text-center shadow-sm rounded-3"
                            [(ngModel)]="codeArray[i]"
                            [ngModelOptions]="{standalone: true}"
                            (keyup)="moveFocus($event, i)"
                            (blur)="validateInputOnBlur(i)"
                            [ngClass]="{'border-danger': validationErrors[i], 'border-1': validationErrors[i]}">
                        </div>
                      </div>                                
                                     
                    <div class="error text-danger ms-3">
                        
                    </div>
                    <div class="d-flex justify-content-between ">
                        <button  class="mt-4 mb-2 text-light p-2 btnStyle bg-brown w-50 mx-auto d-block"[disabled]="!isFormValid()">Verifycode</button>
                    </div>

                </div>
            </form>
            <div class="text-center">
                <p class="text-black mb-2">
                    Don't Reveive Code?
                </p>
                <button class="btn btn-link text-decoration-none fw-bold text-brown p-0" (click)="ResendCode()">
                    Resend Code
                </button>
            </div>

        </div>
    </div>
    <div class="right-section d-none d-md-block w-50">
        <!-- Right section content goes here -->
    </div>
</div>
