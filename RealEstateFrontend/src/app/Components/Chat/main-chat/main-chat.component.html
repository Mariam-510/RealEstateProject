<section>
  <div class="container py-5 h-100">
    <div class="row h-100 d-flex align-items-start">

      <!-- Left Column -->
      <div class="col-md-6 col-lg-5 col-xl-4 mb-4 mb-md-0">
        <h5 class="font-weight-bold mb-3 text-center text-lg-start">Chats</h5>
        <div class="card h-100">
          <div class="card-body overflow-auto p-0">
            <ul class="list-unstyled mb-0">
              <!-- Chat List Items -->
              <li *ngFor="let chat of chats" class="p-2 border-bottom cursor-pointer chat-list-item"
                [class.active-chat]="selectedChat?.id === chat.id" (click)="selectChat(chat)">
                <div class="d-flex justify-content-between align-items-center">
                  <div class="d-flex flex-row" style="min-width: 0;">
                    <img [src]="chat.otherUser.avatar" alt="avatar" class="rounded-circle me-3 shadow-1-strong"
                      width="55">
                    <div class="pt-1 flex-grow-1" style="min-width: 0;">
                      <div class="d-flex justify-content-between align-items-center">
                        <p class="fw-bold mb-0 text-truncate">{{chat.otherUser.name}}</p>
                        <!-- In the chat list item -->
                      </div>
                      <div class="d-flex justify-content-between align-items-center">
                        <p class="small text-muted mb-0 text-truncate">
                          <span *ngIf="chat.lastMessage.sent" class="me-1">
                            <i *ngIf="chat.lastMessage.status === 'Read'" class="bi bi-check2-all text-primary"></i>
                            <i *ngIf="chat.lastMessage.status !== 'Read'" class="bi bi-check2"></i>
                          </span>
                          {{chat.lastMessage.text}}
                        </p>
                        <span *ngIf="chat.unread" class="badge bg-primary rounded-pill ms-2">
                          {{chat.unread}}
                        </span>
                      </div>
                    </div>
                  </div>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>
      <!-- Right Column -->
      <div class="col-md-6 col-lg-7 col-xl-8 d-flex flex-column" *ngIf="selectedChat">
        <div class="card flex-grow-1 d-flex flex-column justify-content-between">

          <!-- 👇 Chat Header moved outside scrollable container -->
          <div class="chat-header d-flex align-items-center px-3 py-2 shadow-sm">
            <img src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?w=600"
              class="rounded-circle me-2 profile-img" width="40" height="40" alt="User profile">
            <div>
              <h6 class="mb-0 fw-bold">Lora</h6>
            </div>
          </div>
          <!-- Accept / Reject Buttons -->
          <!-- <div *ngIf="showAcceptReject" class="d-flex gap-2 px-3 py-2">
    <button class="btn btn-brown" (click)="acceptConversation()">Accept</button>
    <button class="btn btn-outline-brown" (click)="rejectConversation()">Reject</button>
  </div> -->

          <!-- 👇 Now the scrollable container starts -->
          <div class="card-body messages-container">
            <div class="date-separator text-center mb-3">
              <span class="badge bg-light-brown text-brown">
                {{ today | date:'MMMM d, y' }}
              </span>
            </div>

            <!-- Messages -->
            <div *ngFor="let msg of messages" class="message-wrapper ps-4">
              <div class="d-flex mb-3" [ngClass]="msg.sent ? 'justify-content-end' : 'justify-content-start'">


                <div class="d-flex flex-column" [ngClass]="msg.sent ? 'align-items-end' : 'align-items-start'">
                  <div class="d-flex align-items-start" [ngClass]="{'flex-row-reverse': msg.sent}">
                    <!-- Message Bubble -->
                    <div class="message-bubble-with-meta" [ngClass]="{
                        'sent-message': msg.sent,
                        'received-message': !msg.sent
                      }">
                      <p class="mb-1">{{ msg.text }}</p>
                      <div class="bubble-meta text-muted small d-flex justify-content-end align-items-center gap-1">
                        <span>{{ msg.time | date:'shortTime' }}</span>
                        <span *ngIf="msg.sent" class="status-indicator" [ngClass]="getStatusClass(msg.status)">
                          <i *ngIf="msg.status === 'Read'" class="bi bi-check2-all"></i>
                          <i *ngIf="msg.status === 'Delivered'" class="bi bi-check2"></i>
                          <i *ngIf="msg.status === 'Sent'" class="bi bi-check"></i>
                          <i *ngIf="msg.status === 'Pending'" class="bi bi-clock-history"></i>
                          <i *ngIf="msg.status === 'Rejected'" class="bi bi-x-circle"></i>
                        </span>
                      </div>
                    </div>


                  </div>

                </div>
              </div>
            </div>
          </div>

          <!-- Footer -->
          <div class="card-footer text-muted p-3">
            <div class="input-group">
              <textarea class="form-control" [(ngModel)]="newMessage" (keyup.enter)="sendMessage()"
                placeholder="Type your message..." rows="2" style="resize: none;"></textarea>
              <button class="btn btn-brown" type="button" (click)="sendMessage()">
                <i class="bi bi-send-fill"></i>
              </button>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>
