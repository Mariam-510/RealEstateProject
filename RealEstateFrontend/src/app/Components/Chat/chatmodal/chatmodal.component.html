<div class="chat-window" *ngIf="isChatVisible">
  <div class="card">
    <!-- Header Section -->
    <div
      class="card-header d-flex justify-content-between align-items-center p-3"
      style="border-top: 4px solid #4a2c2a">
      <div class="d-flex flex-column w-100 position-relative">
        <div class="d-flex justify-content-between align-items-center">
          <h4 class="mb-0 fw-bold text-brown text-center w-100">
            Ask UrbanNest
          </h4>
          <button
            class="btn-close position-absolute end-0 text-caffe-dark"
            (click)="toggle()"
            aria-label="Close chat"
          ></button>
        </div>
        <!-- Property Info -->
        <!-- <div class="property-info mt-1">
                    <div class="d-flex flex-column align-items-center text-center">
                        <div class="mb-0 ">1464 W Sunrise Ln</div>
                    </div>
                </div> -->
      </div>
    </div>

    <!-- Messages Container -->
    <div class="card-body messages-container" #messagesContainer>
      <!-- Date Separator -->
      <div class="date-separator text-center mb-3">
        <span class="badge bg-light-brown text-brown">
          {{ today | date : "MMMM d, y" }}
        </span>
      </div>

      <div
        *ngFor="let msg of messages; trackBy: trackByMessage"
        class="message-wrapper"
      >
        <div
          class="d-flex mb-3"
          [ngClass]="msg.sent ? 'justify-content-end' : 'justify-content-start'"
        >
          <!-- Receiver Image -->
          <img
            *ngIf="!msg.sent"
            [src]="
              msg.profileImg ||
              'https://www.crossegyptchallenge.com/wp-content/uploads/2022/07/cairo01.jpg'
            "
            class="rounded-circle me-2 profile-img align-self-start"
            width="40"
            height="40"
            alt="User profile"
          />

          <div
            class="d-flex flex-column"
            [ngClass]="msg.sent ? 'align-items-end' : 'align-items-start'"
          >
            <div
              class="d-flex align-items-start"
              [ngClass]="{ 'flex-row-reverse': msg.sent }"
            >
              <!-- Message Bubble -->
              <div
                class="message-bubble-with-meta"
                [ngClass]="{
                  'sent-message': msg.sent,
                  'received-message': !msg.sent
                }"
              >
                <p class="mb-1">{{ msg.text }}</p>
                <div
                  class="bubble-meta text-muted small d-flex justify-content-end align-items-center gap-1"
                >
                  <span>{{ msg.time | date : "shortTime" }}</span>
                </div>
                

              </div>

              <!-- Sender Image -->
              <img
                *ngIf="msg.sent"
                src="https://digital.ihg.com/is/image/ihg/intercontinental-cairo-10367348719-2x1"
                class="rounded-circle ms-2 profile-img align-self-start"
                width="40"
                height="40"
                alt="Sender profile"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer Section -->
    <!-- [class.disabled]="disabled" -->
    <div class="card-footer" >
      <div class="input-group" *ngIf="!disabled">
        <textarea
          class="form-control"
          [(ngModel)]="newMessage"
          (keydown.enter)="!disabled && sendMessage($event)"
          placeholder="Type your message..."
          rows="1"
          [readonly]="disabled"
          [attr.disabled]="disabled ? 'disabled' : null"
        ></textarea>
        <button 
          class="btn btn-brown" 
          (click)="sendMessage($event)" 
          [disabled]="disabled || !newMessage.trim()"
          [attr.disabled]="(disabled || !newMessage.trim()) ? 'disabled' : null"
        >
          <i class="bi bi-send-fill"></i>
        </button>
      </div>
      
      <div *ngIf="disabled" class="status-message d-flex justify-content-center">
          <span *ngIf="this.conversation?.status === 'Closed'" class="text-caffe">
            <i class="bi bi-lock"></i> Message not approved. This conversation is now closed.
          </span>
          <span *ngIf="this.conversation?.status === 'Pending'" class="text-caffe">
            <i class="bi bi-hourglass"></i> Message received! It's waiting for approval.
          </span>
      </div>
    </div>
  </div>
</div>
