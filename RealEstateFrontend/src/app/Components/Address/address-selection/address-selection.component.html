<!-- address-selection.component.html -->
<div class="address-page">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="bg-white p-4 rounded shadow-sm mb-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0">Choose Address</h3>
            <a routerLink="/checkout/address/new" class="btn btn-outline-secondary">
              <i class="bi bi-plus-lg me-2"></i>Add New Address
            </a>
          </div>

          <hr style="border: 2px solid #c38e79" />

          <div class="address-list">
            <div *ngFor="let address of addresses" class="address-card p-3 mb-3 rounded"
              [class.selected]="selectedAddressId === address.id" (click)="selectAddress(address.id)">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <h5 class="mb-2">Address</h5>
                  <p class="mb-1">
                    {{ address.buildingNum }} {{ address.street }},
                    {{ address.city }}
                  </p>
                  <p class="mb-1">
                    Apartment: {{ address.apartment }} - Floor:
                    {{ address.floor }}
                  </p>
                  <p class="mb-0">
                    <strong>Mobile:</strong> {{ address.phoneNum }}
                  </p>
                </div>
                <button class="btn btn-sm btn-outline-danger" (click)="deleteAddress(address.id)">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-end mt-4">
            <a routerLink="/cart" class="btn btn-outline-secondary me-2">
              <i class="bi bi-arrow-left me-2"></i>Back to Cart
            </a>
            <!-- <a routerLink="/checkout/payment" class="btn btn-primary" [class.disabled]="!selectedAddressId">
              Continue to Payment
            </a> -->
            <a [routerLink]="['/checkout/payment']" [queryParams]="{ id: selectedAddressId }" class="btn btn-primary"
              [class.disabled]="!selectedAddressId">
              Continue to Payment
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
