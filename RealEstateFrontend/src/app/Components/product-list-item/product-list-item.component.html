<div class="product-list-item p-3">
  <div class="row">
    <!-- Image on the right -->
    <div class="col-md-4 order-md-2">
      <div class="position-relative">
        <img
          [src]="
            'https://st3.depositphotos.com/1177973/12669/i/450/depositphotos_126693854-stock-photo-set-of-body-care-products.jpg'
          "
          class="card-img"
          alt="Product image"
          (error)="productService.setFallbackImageForCard($event)"
        />
      </div>
    </div>

    <!-- Content on the left -->
    <div class="col-md-8 order-md-1">
      <div class="card-body h-100">
        <div class="row h-100">
          <div
            class="title-price-section d-flex flex-column justify-content-start align-items-start col-8 h-100"
          >
            <h3 class="card-title fs-4">{{ product.name }}</h3>
            <br />
            <p class="card-text">{{ product.description }}</p>

            <!-- Buttons version one -->
            <div class="buttons-container mt-auto d-flex gap-2">
              <button
                class="btn btn-outline-danger fw-bold"
                (click)="toggleWishlist()"
              >
                <i
                  class="bi me-2"
                  [class.bi-heart-fill]="inWishlist"
                  [class.bi-heart]="!inWishlist"
                ></i>
                {{ inWishlist ? "In Wishlist" : "Add to Wishlist" }}
              </button>
              <button class="btn btn-primary fw-bold" (click)="toggleCart()">
                <i
                  class="bi me-2"
                  [class.bi-cart-fill]="inCart"
                  [class.bi-cart]="!inCart"
                ></i>
                {{ inCart ? "In Cart" : "Add to Cart" }}
              </button>
            </div>

            <!-- buttons version 2 -->
            <!-- <div class="buttons-container mt-auto d-flex gap-2">
              <button class="btn btn-wishlist" (click)="toggleWishlist()">
                <i
                  class="bi me-1"
                  [class.bi-heart-fill]="inWishlist"
                  [class.bi-heart]="!inWishlist"
                ></i>
                {{ inWishlist ? "In Wishlist" : "Add to Wishlist" }}
              </button>
              <button class="btn btn-cart" (click)="toggleCart()">
                <i
                  class="bi me-1"
                  [class.bi-cart-fill]="inCart"
                  [class.bi-cart]="!inCart"
                ></i>
                {{ inCart ? "In Cart" : "Add to Cart" }}
              </button>
            </div> -->
          </div>

          <div
            class="price--rating-section fs-4 col-4 d-flex flex-column justify-content-between align-items-end"
          >
            <!-- Rating section -->
            <div
              class="rating-section d-flex align-items-center gap-1 mt-2"
              title="Average rating: {{ product.averageRating }}"
            >
              <ng-container *ngFor="let star of fullStars">
                <i class="bi bi-star-fill fs-3 rating-star"></i>
              </ng-container>
              <ng-container *ngIf="hasHalfStar">
                <i class="bi bi-star-half fs-3 rating-star"></i>
              </ng-container>
              <ng-container *ngFor="let star of emptyStars">
                <i class="bi bi-star fs-3 rating-star"></i>
              </ng-container>
            </div>

            <!-- Price -->
            <h3 style="color: #c38e79">${{ product.price | number }}</h3>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
