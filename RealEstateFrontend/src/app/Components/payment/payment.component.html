<!-- payment.component.html -->
<div class="payment-page">
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="bg-white p-4 rounded shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h3 class="mb-0">Payment Method</h3>
              <a routerLink="/checkout/address" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Back
              </a>
            </div>
  
            <hr style="border: 2px solid #c38e79">
  
            <div class="payment-methods">
              <div class="list-group mb-4">
                <button *ngFor="let method of paymentMethods"
                        type="button"
                        class="list-group-item list-group-item-action d-flex flex-column align-items-start p-3"
                        [class.active]="selectedMethod === method.id"
                        (click)="selectedMethod = method.id">
                  <div class="d-flex w-100 align-items-center">
                    <i class="bi {{ method.icon }} me-3 fs-4"></i>
                    <div>
                      <h6 class="mb-0">{{ method.name }}</h6>
                      <small class="text-muted">{{ method.description }}</small>
                    </div>
                    <i class="bi bi-check-circle-fill ms-auto" 
                       *ngIf="selectedMethod === method.id"></i>
                  </div>
                </button>
              </div>
  
              <!-- Stripe Card Element (only visible when Credit Card selected) -->
              <div *ngIf="selectedMethod === 'stripe'" class="mb-4 p-3 border rounded">
                <div class="d-flex align-items-center mb-3">
                  <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/stripe/stripe-original.svg" 
                       alt="Stripe" style="height: 30px; margin-right: 15px;">
                  <div>
                    <h6 class="mb-0">Secure Card Payment</h6>
                    <div class="card-icons mt-1">
                      <i class="bi bi-credit-card-2-front fs-5 me-2"></i>
                      <i class="fab fa-cc-visa fs-5 me-2"></i>
                      <i class="fab fa-cc-mastercard fs-5 me-2"></i>
                      <i class="fab fa-cc-amex fs-5"></i>
                    </div>
                  </div>
                </div>
                
                <div id="card-element" class="mb-3 p-2 border rounded"></div>
                
                <small class="text-muted d-block mt-2">
                  <i class="bi bi-lock-fill me-2"></i>
                  Your payment is secure and encrypted
                </small>
              </div>
  
              <div class="order-summary p-3 mb-4 border rounded">
                <h5 class="mb-3">Order Summary</h5>
                <div class="d-flex justify-content-between mb-2">
                  <span>Subtotal:</span>
                  <span>{{ cartService.getSubtotal() | currency:'USD' }}</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                  <span>Shipping:</span>
                  <span>{{ 50 | currency:'USD' }}</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between fw-bold fs-5">
                  <span>Total:</span>
                  <span>{{ cartService.getSubtotal() + 50 | currency:'USD' }}</span>
                </div>
              </div>
  
              <div class="d-flex justify-content-between">
                <a routerLink="/checkout/address" class="btn btn-outline-secondary">
                  <i class="bi bi-arrow-left me-2"></i>Back
                </a>
                <button class="btn btn-primary" (click)="handlePayment()">
                  Complete Order
                  <i class="bi bi-lock-fill ms-2"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
